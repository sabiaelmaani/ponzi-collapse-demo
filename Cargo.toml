[package]
name = "ponzisim"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
yew = { version = "0.21", features = ["csr"] }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "HtmlInputElement"] }
plotters = { version = "0.3", default-features = false, features = ["line_series", "full_palette", "all_series"] }
plotters-canvas = "0.3"
gloo-timers = { version = "0.3", features = ["futures"] }
